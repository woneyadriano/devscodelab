<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-visual">
<title>DEVS CODE LAB | Plataforma de Programação por Níveis</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&family=Orbitron:wght@700;900&family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet">

<style>
:root {
  --green: #25D366;
  --dark-green: #075E54;
  --light-green: #128C7E;
  --bg: #0b1120;
  --surface: #111827;
  --surface2: #1f2937;
  --border: #374151;
  --text: #f9fafb;
  --text-muted: #9ca3af;
  --accent: #25D366;
  --yellow: #fbbf24;
  --blue: #3b82f6;
  --red: #ef4444;
  --purple: #8b5cf6;
  --orange: #f97316;
  --pink: #ec4899;
  --cyan: #06b6d4;
  --radius: 20px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Inter', 'Syne', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}
/* Níveis de conhecimento - badges estilizadas */
.level-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 12px; border-radius: 40px; font-size: 0.7rem;
  font-weight: 800; letter-spacing: 0.5px;
}
.level-apprentice { background: linear-gradient(135deg, #4b5563, #374151); color: #e5e7eb; border: 1px solid #6b7280; }
.level-beginner { background: linear-gradient(135deg, #065f46, #047857); color: #a7f3d0; border: 1px solid #10b981; }
.level-intermediate { background: linear-gradient(135deg, #1e3a8a, #1d4ed8); color: #bfdbfe; border: 1px solid #3b82f6; }
.level-advanced { background: linear-gradient(135deg, #7c2d12, #9a3412); color: #fed7aa; border: 1px solid #f97316; }

/* Hero redesign */
.hero {
  background: linear-gradient(135deg, #070d1a 0%, #0a1f14 40%, #060e1e 100%);
  padding: 2rem 1.5rem;
  text-align: center;
  border-bottom: 1px solid rgba(37,211,102,0.3);
  position: relative;
  overflow: hidden;
}
.hero-glow {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(37,211,102,0.15) 0%, transparent 60%);
}
.hero-inner {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
}
.hero-logo-icon {
  width: 70px; height: 70px;
  background: linear-gradient(135deg, var(--dark-green), var(--light-green));
  border-radius: 22px;
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem;
  box-shadow: 0 0 40px rgba(37,211,102,0.4);
}
.hero-title {
  font-family: 'Orbitron', monospace;
  font-size: clamp(1.8rem, 6vw, 3.2rem);
  font-weight: 900;
  background: linear-gradient(90deg, #fff, var(--green), #06d6a0);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero-desc {
  color: var(--text-muted);
  max-width: 650px;
  font-size: 0.9rem;
}
.hero-badges {
  display: flex; flex-wrap: wrap; gap: 10px;
  justify-content: center; margin-top: 0.8rem;
}
.hero-badge {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 40px;
  padding: 5px 14px;
  font-size: 0.7rem;
  font-weight: 600;
}

/* Tabs de linguagem com dropdown de níveis */
.lang-tabs-header {
  display: flex; flex-wrap: wrap;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0.5rem 1rem;
  gap: 6px;
  position: sticky; top: 0; z-index: 40;
}
.lang-tab-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-weight: 600;
  padding: 8px 18px;
  border-radius: 40px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: 'Syne', sans-serif;
  font-size: 0.8rem;
}
.lang-tab-btn.active {
  background: var(--dark-green);
  color: white;
}
.lang-tab-btn:hover { background: var(--surface2); color: var(--text); }

.level-selector {
  display: flex; gap: 8px;
  margin: 1rem 1.5rem;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0.8rem;
}
.level-btn {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 40px;
  padding: 6px 18px;
  font-weight: 700;
  font-size: 0.75rem;
  cursor: pointer;
  transition: all 0.2s;
  color: var(--text-muted);
}
.level-btn.active {
  background: var(--purple);
  border-color: var(--purple);
  color: white;
}
.level-btn[data-level="apprentice"]:hover { border-color: #9ca3af; }
.level-btn[data-level="beginner"]:hover { border-color: #10b981; }
.level-btn[data-level="intermediate"]:hover { border-color: #3b82f6; }
.level-btn[data-level="advanced"]:hover { border-color: #f97316; }

/* Conteúdo de aprendizado por nível */
.level-content {
  display: none;
  animation: fadeIn 0.3s ease;
}
.level-content.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* Cards de conteúdo didático */
.learning-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  gap: 1.5rem;
  margin-bottom: 2rem;
}
.learn-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 1.5rem;
  transition: all 0.25s;
}
.learn-card:hover { border-color: var(--green); transform: translateY(-3px); }
.learn-card h3 {
  font-size: 1.2rem;
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--green);
}
.learn-card p { color: var(--text-muted); line-height: 1.6; font-size: 0.9rem; }

.code-panel {
  background: #0d1117;
  border-radius: 16px;
  overflow: hidden;
  margin: 1rem 0;
}
.code-header {
  background: #161b22;
  padding: 0.5rem 1rem;
  border-bottom: 1px solid #30363d;
  font-size: 0.75rem;
  color: var(--text-muted);
  display: flex;
  gap: 8px;
}
.code-content {
  padding: 1rem;
  font-family: 'Space Mono', monospace;
  font-size: 0.8rem;
  overflow-x: auto;
  color: #e6edf3;
  line-height: 1.6;
}
.output-demo {
  background: #0a0f16;
  border-radius: 12px;
  padding: 1rem;
  border-left: 3px solid var(--green);
  font-family: 'Space Mono', monospace;
  font-size: 0.75rem;
  color: #7ee787;
  margin-top: 0.8rem;
}
.challenge-box {
  background: linear-gradient(135deg, rgba(139,92,246,0.1), rgba(79,70,229,0.05));
  border: 1px solid rgba(139,92,246,0.3);
  border-radius: 20px;
  padding: 1.2rem;
  margin-top: 1rem;
}
.challenge-box h4 { color: #a78bfa; margin-bottom: 0.5rem; }
.quiz-mini {
  background: var(--surface2);
  border-radius: 16px;
  padding: 1rem;
  margin-top: 1rem;
}
.quiz-mini-question {
  font-weight: 700;
  margin-bottom: 0.8rem;
}
.quiz-mini-opt {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 40px;
  padding: 5px 12px;
  margin: 5px;
  display: inline-block;
  cursor: pointer;
  font-size: 0.8rem;
  transition: 0.1s;
}
.quiz-mini-opt:hover { border-color: var(--green); }
.quiz-mini-feedback { font-size: 0.75rem; margin-top: 0.5rem; color: var(--yellow); }

/* Tabs gerais */
.tabs-nav {
  display: flex; flex-wrap: wrap;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0.5rem 1rem;
  gap: 8px;
}
.tab-btn {
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-muted);
  padding: 8px 20px;
  border-radius: 40px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;
}
.tab-btn.active {
  background: var(--dark-green);
  color: white;
  border-color: var(--green);
}
.tab-btn.tab-activities.active { background: linear-gradient(135deg, #7c3aed, #4f46e5); }
.tab-content { display: none; padding: 1.5rem; max-width: 1400px; margin: 0 auto; }
.tab-content.active { display: block; }

/* Atividades (preservado) */
.activities-hero {
  background: linear-gradient(135deg, rgba(124,58,237,0.15), rgba(79,70,229,0.1));
  border-radius: 20px;
  padding: 1.5rem;
  margin-bottom: 1.5rem;
}
.act-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
.act-card { background: var(--surface); border-radius: 20px; padding: 1.2rem; border: 1px solid var(--border); }
.act-card-title { font-weight: 700; }
.btn-purple { background: linear-gradient(135deg, #7c3aed, #4f46e5); color: white; border: none; padding: 8px 16px; border-radius: 40px; cursor: pointer; }
.btn-green { background: var(--dark-green); color: white; border: none; padding: 8px 18px; border-radius: 40px; cursor: pointer; }
.btn-outline { background: transparent; border: 1px solid var(--green); color: var(--green); padding: 6px 14px; border-radius: 40px; cursor: pointer; }

/* Footer */
footer { text-align: center; padding: 1.5rem; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 0.75rem; }

@media (max-width: 640px) {
  .learning-grid { grid-template-columns: 1fr; }
  .level-btn { padding: 4px 12px; font-size: 0.7rem; }
  .lang-tab-btn { padding: 5px 12px; font-size: 0.7rem; }
}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-glow"></div>
  <div class="hero-inner">
    <div class="hero-logo-icon">💻</div>
    <h1 class="hero-title">DEVS CODE LAB</h1>
    <p class="hero-desc">Domine a programação com roteiros de aprendizado por níveis — do aprendiz ao avançado, com conteúdo estilo faculdade federal.</p>
    <div class="hero-badges">
      <span class="hero-badge"><i class="fas fa-seedling"></i> Aprendiz</span>
      <span class="hero-badge"><i class="fas fa-rocket"></i> Iniciante</span>
      <span class="hero-badge"><i class="fas fa-chart-line"></i> Intermediário</span>
      <span class="hero-badge"><i class="fas fa-crown"></i> Avançado</span>
    </div>
  </div>
</div>

<!-- Navegação de linguagens -->
<div class="lang-tabs-header" id="langTabsHeader"></div>

<!-- Seletor de níveis (aparece dinâmico) -->
<div class="level-selector" id="levelSelector"></div>

<!-- Conteúdo principal da linguagem ativa -->
<main id="mainLangContent"></main>

<!-- Abas secundárias (Atividades, CodePrompt, Feedback) -->
<div class="tabs-nav" id="secondaryTabs"></div>
<main id="secondaryContent"></main>

<footer><i class="fas fa-code"></i> DEVS CODE LAB — Aprendizado progressivo do zero à excelência</footer>

<script>
// ============================================================
// BASE DE CONHECIMENTO POR LINGUAGEM E NÍVEL (material excepcional)
// ============================================================
const languages = [
  { id: "python", name: "🐍 Python", icon: "fab fa-python" },
  { id: "javascript", name: "🟨 JavaScript", icon: "fab fa-js" },
  { id: "java", name: "☕ Java", icon: "fab fa-java" },
  { id: "htmlcss", name: "🌐 HTML/CSS", icon: "fab fa-html5" }
];

// Material didático de nível acadêmico para cada linguagem e nível
const levelContent = {
  // PYTHON
  python: {
    apprentice: {
      title: "🧠 Aprendiz: Primeiros Passos com Python",
      intro: "Python é a linguagem mais amigável para quem nunca programou. Este módulo ensina lógica, variáveis, tipos e estruturas básicas.",
      theory: [
        "Variáveis e tipos: inteiros, floats, strings, booleanos.",
        "Operadores aritméticos e de comparação.",
        "Entrada e saída com input() e print().",
        "Estruturas condicionais: if, elif, else.",
        "Laços: while e for (range)."
      ],
      code: `# Exemplo prático: calculadora de média
notas = []
for i in range(3):
    nota = float(input(f"Digite a nota {i+1}: "))
    notas.append(nota)
media = sum(notas) / len(notas)
print(f"Sua média é: {media:.1f}")
if media >= 7:
    print("✅ Aprovado! Parabéns!")
else:
    print("📚 Estude mais na próxima!")`,
      output: `Digite a nota 1: 8.5\nDigite a nota 2: 7.0\nDigite a nota 3: 9.0\nSua média é: 8.2\n✅ Aprovado! Parabéns!`,
      challenge: "Crie um programa que recebe o nome e a idade e informa se a pessoa é maior de idade (>=18).",
      quiz: [{ q: "Qual função exibe algo na tela?", opts: ["input()", "print()", "output()", "show()"], correct: 1 }]
    },
    beginner: {
      title: "🚀 Iniciante: Estruturas de Dados e Funções",
      intro: "Aprofunde com listas, dicionários, tuplas e funções. Base sólida para qualquer projeto.",
      theory: [
        "Listas: métodos append, remove, slicing, compreensão.",
        "Dicionários: chave-valor, iteração.",
        "Funções: def, parâmetros, return, escopo.",
        "Tratamento básico de exceções (try/except).",
        "Módulos e importação."
      ],
      code: `def filtrar_aprovados(alunos):
    aprovados = []
    for nome, nota in alunos.items():
        if nota >= 7:
            aprovados.append(nome)
    return aprovados

turma = {"Ana": 8.5, "Bruno": 6.0, "Carla": 9.2, "Diego": 5.5}
print("Aprovados:", filtrar_aprovados(turma))`,
      output: `Aprovados: ['Ana', 'Carla']`,
      challenge: "Crie uma função que recebe uma lista de números e retorna a média, o maior e o menor valor.",
      quiz: [{ q: "Qual método adiciona um elemento ao final da lista?", opts: ["append()", "insert()", "add()", "push()"], correct: 0 }]
    },
    intermediate: {
      title: "⚡ Intermediário: POO, Arquivos e Decoradores",
      intro: "Programação Orientada a Objetos, manipulação de arquivos, decoradores e boas práticas.",
      theory: [
        "Classes e objetos: __init__, self, métodos.",
        "Herança, encapsulamento e polimorfismo.",
        "Leitura/escrita de arquivos (open, with).",
        "Decoradores básicos e @staticmethod.",
        "List comprehensions avançadas e generators."
      ],
      code: `class Estudante:
    def __init__(self, nome, notas):
        self.nome = nome
        self.notas = notas
    def media(self):
        return sum(self.notas)/len(self.notas)
    def situacao(self):
        return "Aprovado" if self.media() >= 7 else "Recuperação"

aluno = Estudante("Mariana", [8, 7.5, 9])
print(f"{aluno.nome}: {aluno.media():.1f} - {aluno.situacao()}")`,
      output: `Mariana: 8.2 - Aprovado`,
      challenge: "Crie um sistema de cadastro de produtos com classe Produto (nome, preço, quantidade) e um método para calcular valor total em estoque.",
      quiz: [{ q: "Qual palavra-chave define uma classe em Python?", opts: ["class", "def", "object", "struct"], correct: 0 }]
    },
    advanced: {
      title: "🏆 Avançado: Iteradores, Context Managers e Concorrência",
      intro: "Conceitos de nível superior: generators, context managers, threading, e padrões de projeto.",
      theory: [
        "Iteradores e generators (yield).",
        "Context managers com __enter__/__exit__ ou contextlib.",
        "Threading e asyncio (programação assíncrona).",
        "Decoradores com parâmetros e functools.wraps.",
        "Testes unitários com unittest/pytest."
      ],
      code: `import asyncio

async def buscar_dados(id):
    await asyncio.sleep(1)
    return f"Dados do item {id}"

async def main():
    tarefas = [buscar_dados(i) for i in range(5)]
    resultados = await asyncio.gather(*tarefas)
    for r in resultados:
        print(r)

asyncio.run(main())`,
      output: `Dados do item 0\nDados do item 1\n... (assíncrono)`,
      challenge: "Implemente um decorador que mede o tempo de execução de uma função e um generator que produz números da sequência de Fibonacci infinitamente.",
      quiz: [{ q: "Qual biblioteca é usada para programação assíncrona em Python?", opts: ["async", "asyncio", "threading", "multiprocessing"], correct: 1 }]
    }
  },
  // JAVASCRIPT
  javascript: {
    apprentice: { title: "🧠 Aprendiz: Fundamentos JS", intro: "Variáveis, tipos, operadores, condicionais e loops.", theory: ["var/let/const", "tipos primitivos", "if/else", "for/while"], code: `let idade = 18;\nif(idade >= 18) console.log("Maior de idade");`, output: `Maior de idade`, challenge: "Faça um programa que exibe números pares de 1 a 20.", quiz: [{ q: "Qual palavra declara variável mutável?", opts: ["const", "let", "var", "ambos let/var"], correct: 3 }] },
    beginner: { title: "🚀 Iniciante: Funções e Arrays", intro: "Funções, arrays, objetos e manipulação do DOM.", theory: ["function declaration/expression", "métodos de array (map, filter)", "objetos literais"], code: `const nums = [1,2,3,4];\nconst dobrados = nums.map(n => n*2);\nconsole.log(dobrados);`, output: `[2,4,6,8]`, challenge: "Crie uma função que retorna a soma de todos os elementos de um array.", quiz: [{ q: "Método que executa uma função para cada elemento?", opts: ["forEach", "map", "filter", "reduce"], correct: 0 }] },
    intermediate: { title: "⚡ Intermediário: POO, Async e Promises", intro: "Classes, herança, promises, async/await, fetch API.", theory: ["class e constructor", "Promise e then/catch", "async/await", "fetch"], code: `class Usuario {\n  constructor(nome){ this.nome = nome; }\n  saudar(){ return \`Olá, \${this.nome}\`; }\n}\nconst u = new Usuario("Ana");\nconsole.log(u.saudar());`, output: `Olá, Ana`, challenge: "Crie uma função assíncrona que busque dados de uma API fake (JSONPlaceholder) e exiba os títulos.", quiz: [{ q: "O que retorna uma Promise resolvida?", opts: ["resolve()", "then()", "await", "callback"], correct: 1 }] },
    advanced: { title: "🏆 Avançado: Closures, Proxy, Generators", intro: "Closures, IIFE, Proxy, Generators, Web Workers.", theory: ["closures e escopo léxico", "Proxy e Reflect", "function* generator", "Event Loop avançado"], code: `function* geradorId() {\n  let id = 1;\n  while(true) yield id++;\n}\nconst gen = geradorId();\nconsole.log(gen.next().value);`, output: `1`, challenge: "Implemente um Proxy que valida propriedades de um objeto (idade não pode ser negativa).", quiz: [{ q: "Qual símbolo cria um generator?", opts: ["*", "yield", "async", "await"], correct: 0 }] }
  },
  // JAVA
  java: {
    apprentice: { title: "🧠 Aprendiz: Sintaxe e Estruturas", intro: "Classe principal, tipos, condicionais, loops.", theory: ["public static void main", "int, double, String", "if/else, switch", "for, while"], code: `public class Main {\n  public static void main(String[] args) {\n    int soma = 0;\n    for(int i=1;i<=5;i++) soma+=i;\n    System.out.println("Soma: "+soma);\n  }\n}`, output: `Soma: 15`, challenge: "Faça um programa que leia um número e diga se é primo.", quiz: [{ q: "Método principal em Java?", opts: ["main()", "public static void main(String[] args)", "start()", "run()"], correct: 1 }] },
    beginner: { title: "🚀 Iniciante: Arrays e Métodos", intro: "Arrays, métodos, sobrecarga, classes básicas.", theory: ["arrays unidimensionais", "métodos estáticos", "sobrecarga de métodos"], code: `public static int maior(int a, int b) { return a>b?a:b; }`, output: `exemplo: maior(10,20) retorna 20`, challenge: "Crie um método que inverte um array.", quiz: [{ q: "Palavra para criar um array?", opts: ["new int[]", "array()", "list", "ArrayList"], correct: 0 }] },
    intermediate: { title: "⚡ Intermediário: POO, Herança, Interfaces", intro: "Classes, herança, polimorfismo, interfaces, ArrayList.", theory: ["extends, super", "override", "interface implements", "ArrayList"], code: `interface Animal { void som(); }\nclass Cachorro implements Animal { public void som(){ System.out.println("Au au"); } }`, output: `Au au`, challenge: "Crie uma hierarquia de classes Funcionario -> Gerente com método calcularBonus().", quiz: [{ q: "Palavra para implementar interface?", opts: ["extends", "implements", "implements", "inherit"], correct: 1 }] },
    advanced: { title: "🏆 Avançado: Streams, Generics, Threads", intro: "Stream API, Generics, Threads, Lambda, Collections avançado.", theory: ["Streams e method reference", "Generics (T)", "Thread e Runnable", "Optional"], code: `List<String> nomes = Arrays.asList("Ana","Bruno");\nnomes.stream().filter(n->n.startsWith("A")).forEach(System.out::println);`, output: `Ana`, challenge: "Implemente uma thread que imprime números de 1 a 10 com sleep de 1s.", quiz: [{ q: "Pacote de Stream API?", opts: ["java.util.stream", "java.io", "java.util", "java.lang"], correct: 0 }] }
  },
  // HTML/CSS

function renderLangTabs() {
  const container = document.getElementById("langTabsHeader");
  container.innerHTML = languages.map(lang => `
    <button class="lang-tab-btn ${currentLang === lang.id ? 'active' : ''}" data-lang="${lang.id}">
      <i class="${lang.icon}"></i> ${lang.name}
    </button>
  `).join("");
  document.querySelectorAll(".lang-tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      currentLang = btn.dataset.lang;
      renderLangTabs();
      renderLevelSelector();
      renderLevelContent();
    });
  });
}

function renderLevelSelector() {

    </button>

  document.querySelectorAll(".level-btn").forEach(btn => {
    btn.addEventListener("click", () => {

  });
}
